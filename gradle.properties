# Gradle properties shared across all sub-projects.

# Use the Gradle daemon for faster incremental builds.
org.gradle.daemon=true

# Allow the daemon to use up to 2 GB; bump if you hit OOM during dexing.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin incremental compilation speeds up rebuilds significantly.
kotlin.incremental=true

# AndroidX opt-in is required by the CloudStream plugin's manifest merger.
android.useAndroidX=true

# Suppress the "CONFIGURE_ON_DEMAND" experimental feature warning.
org.gradle.configureondemand=false
